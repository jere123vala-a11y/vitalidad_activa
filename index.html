<html lang="es" data-theme="deportivo">
<head>

    <style>
        :root[data-theme="deportivo"] {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-header: linear-gradient(135deg, rgba(15, 23, 42, 0.88), rgba(30, 41, 59, 0.92));
            --neon-yellow: #facc15;
            --neon-green: #22c55e;
            --fire-orange: #ff5722;
            --electric-blue: #38bdf8;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            --nav-bg: #0b0f19;
            --input-bg: #0f172a;
        }

        :root[data-theme="minimalista"] {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-header: linear-gradient(135deg, rgba(14, 165, 233, 0.9), rgba(30, 58, 138, 0.92));
            --neon-yellow: #0284c7;
            --neon-green: #16a34a;
            --fire-orange: #e11d48;
            --electric-blue: #0284c7;
            --text-light: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            --nav-bg: #ffffff;
            --input-bg: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            padding-bottom: 95px;
        }

        header {
            background: var(--bg-header), 
                        url('https://images.unsplash.com/photo-1517838277536-f5f99be501cd?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            color: #ffffff;
            text-align: center;
            padding: 35px 20px 20px;
            border-bottom: 3px solid var(--neon-yellow);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        header h1 {
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        header p {
            color: #e2e8f0;
            font-size: 0.95rem;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .user-status-bar {
            background-color: var(--bg-card);
            color: var(--electric-blue);
            padding: 12px 15px;
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            gap: 10px;
            flex-wrap: wrap;
        }

        .controls-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-select {
            background: var(--input-bg);
            color: var(--text-light);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            outline: none;
        }

        .btn-switch-user {
            background: transparent;
            color: var(--neon-yellow);
            border: 1px solid var(--neon-yellow);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.25s ease;
            text-transform: uppercase;
        }

        .btn-switch-user:hover {
            background-color: var(--neon-yellow);
            color: #0f172a;
            transform: scale(1.05);
        }

        .motivation-box {
            background: var(--bg-card);
            border-left: 5px solid var(--fire-orange);
            padding: 16px;
            margin: 18px 15px;
            border-radius: 12px;
            text-align: center;
            font-weight: 700;
            font-size: 1.05rem;
            box-shadow: var(--box-shadow);
            color: var(--text-light);
            border: 1px solid var(--border-color);
            border-left-width: 5px;
        }

        .container {
            padding: 10px;
            max-width: 800px;
            margin: 0 auto;
        }

        .page-section {
            display: none;
        }

        .page-section.active {
            display: block;
        }

        .semana-selector-container {
            margin: 20px 5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .semana-selector-container label {
            font-weight: 800;
            font-size: 1.05rem;
            color: var(--neon-yellow);
            text-transform: uppercase;
        }

        .semana-select {
            padding: 12px;
            font-size: 1rem;
            border-radius: 12px;
            border: 2px solid var(--electric-blue);
            background-color: var(--bg-card);
            color: var(--text-light);
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            box-shadow: var(--box-shadow);
        }

        .semana-block {
            display: none;
        }

        .semana-block.active {
            display: block;
        }

        .video-card {
            background-color: var(--bg-card);
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: var(--box-shadow);
            border: 1px solid var(--border-color);
        }

        .video-placeholder {
            background-size: cover;
            background-position: center;
            width: 100%;
            aspect-ratio: 16/9;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            position: relative;
            padding: 15px;
        }

        .video-placeholder::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.2));
        }

        .badge-intensity {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: var(--fire-orange);
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 5px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            z-index: 2;
        }

        .video-placeholder span {
            color: #ffffff;
            font-weight: 800;
            font-size: 1.1rem;
            z-index: 1;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .video-info {
            padding: 20px;
        }

        .video-info h3 {
            margin-bottom: 8px;
            color: var(--neon-yellow);
            font-size: 1.3rem;
            font-weight: 800;
        }

        .video-info p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .btn-complete {
            background: linear-gradient(135deg, var(--neon-green), #16a34a);
            color: #ffffff;
            border: none;
            padding: 16px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 800;
            width: 100%;
            text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
            transition: all 0.25s ease;
        }

        .btn-complete.completed {
            background: linear-gradient(135deg, #475569, #334155);
            color: var(--neon-yellow);
            border: 1px solid var(--neon-yellow);
        }

        .progress-header {
            background: var(--bg-card);
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 25px;
            border: 2px solid var(--electric-blue);
            box-shadow: var(--box-shadow);
        }

        .progress-header h2 {
            color: var(--neon-yellow);
            font-size: 1.5rem;
            text-transform: uppercase;
            font-weight: 800;
        }

        .progress-bar-container {
            background-color: var(--input-bg);
            border-radius: 15px;
            height: 26px;
            width: 100%;
            margin-top: 18px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, var(--electric-blue), var(--neon-green));
            height: 100%;
            width: 0%;
            transition: width 0.6s ease;
        }

        .medals-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .medal-item {
            background-color: var(--bg-card);
            padding: 20px 15px;
            border-radius: 16px;
            text-align: center;
            opacity: 0.35;
            transition: all 0.4s ease;
            border: 1px solid var(--border-color);
        }

        .medal-item.unlocked {
            opacity: 1;
            transform: translateY(-3px);
            border: 2px solid var(--neon-yellow);
            box-shadow: 0 6px 20px rgba(250, 204, 21, 0.2);
        }

        .medal-icon {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 8px;
        }

        nav.nav-bottom {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 80px;
            background-color: var(--nav-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 2px solid var(--border-color);
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .nav-item-icon {
            font-size: 2rem;
            margin-bottom: 2px;
        }

        .nav-item.active {
            color: var(--neon-yellow);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-content {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 2px solid var(--electric-blue);
        }

        .modal-content h2 {
            margin-bottom: 15px;
            color: var(--neon-yellow);
            text-transform: uppercase;
        }

        .modal-content p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .form-input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--input-bg);
            color: var(--text-light);
            font-size: 1rem;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--fire-orange), #ea580c);
            color: #ffffff;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
        }

        .celebration-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .celebration-content {
            background: var(--bg-card);
            border: 3px solid var(--neon-yellow);
            padding: 35px 25px;
            border-radius: 24px;
            width: 90%;
            max-width: 450px;
            text-align: center;
        }

        .animated-medal {
            font-size: 6rem;
            display: inline-block;
            margin-bottom: 10px;
        }

        .confetti-piece {
            position: absolute;
            width: 10px
